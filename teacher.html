<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher control panel</title><style>
:root{--lapis:#16324F;--clay:#A8452F;--gold:#C9973A;--paper:#FBF8F3;--ink:#242220;--card:#FFFFFF;--line:#E3DACB;--muted:#6b6258;}
@media(prefers-color-scheme:dark){:root{--paper:#161311;--ink:#EDE7DD;--card:#211D19;--line:#3A342C;--muted:#a79d8e;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;}
h1{font-family:Georgia,"Times New Roman",serif;font-size:27px;margin:0 0 6px;color:var(--lapis);}
h2{font-family:Georgia,serif;font-size:18px;margin:22px 0 4px;color:var(--lapis);}
@media(prefers-color-scheme:dark){h1,h2{color:var(--gold);}}
.wrap{max-width:700px;margin:0 auto;padding:22px 18px 70px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:14px 0;}
.brand{font-family:Georgia,serif;font-size:13px;letter-spacing:.03em;color:var(--gold);margin:0 0 6px;}
.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px;}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 5px;}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:15px;}
.btn{appearance:none;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--clay);color:#fff;margin:14px 10px 0 0;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:var(--clay);font-size:13.5px;margin-top:8px;min-height:1em;}
.hide{display:none!important;}
.timerbar{position:sticky;top:0;z-index:5;background:var(--lapis);color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 12px 12px;}
.timerbar .clock{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.timerbar .clock.low{color:#F2C6B8;}
.passage{line-height:1.65;font-size:15px;}
.qcard{background:var(--card);border:1px solid var(--line);border-left:5px solid #A8452F;border-radius:10px;padding:15px 17px;margin:10px 0;}
.qtag{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:#A8452F;padding:2px 8px;border-radius:20px;margin-bottom:7px;}
.qtext{font-size:15px;margin:0 0 9px;line-height:1.4;}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:14px;}
.opt:hover{background:var(--paper);}
select{padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;width:100%;}
.submitbar{position:sticky;bottom:0;background:var(--paper);padding:14px 0 6px;border-top:1px solid var(--line);margin-top:10px;}
.scorebig{font-size:46px;font-weight:700;color:var(--lapis);margin:4px 0;}
@media(prefers-color-scheme:dark){.scorebig{color:var(--gold);}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.stat .n{font-size:19px;font-weight:700;}.stat .l{font-size:11.5px;color:var(--muted);}
.sendstat{font-size:13px;margin:10px 0;padding:8px 12px;border-radius:8px;background:#EEF2F6;color:var(--ink);}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5;}
#qrbox{text-align:center;padding:14px 0;}

.big{font-size:40px;font-weight:700;letter-spacing:.04em;margin:4px 0;color:var(--lapis);}@media(prefers-color-scheme:dark){.big{color:var(--gold);}}
.row{display:flex;flex-wrap:wrap;gap:0;}.names span{display:inline-block;margin:3px 8px 3px 0;font-size:14px;}
</style></head><body><div class="wrap">
<h1>Teacher control panel</h1>
<div class="card" id="login"><label for="pin">Teacher PIN</label><input type="password" id="pin"><div class="err" id="lerr"></div><button class="btn" id="go">Sign in</button></div>
<div id="panel" class="hide">
<div class="card"><label for="qsel">Quiz</label><select id="qsel"></select><p class="sub" style="margin-top:10px">Student link: <strong id="link"></strong></p></div>
<div class="card"><p class="sub">Status: <strong id="state"></strong></p><div class="sub">Password for students</div><div class="big" id="pw">-</div>
<div class="sub">Time remaining</div><div class="big" id="clk">-</div>
<label for="dur">Duration in minutes (used when you open a session)</label><input type="text" id="dur" value="60">
<label for="npw">Password (leave empty to generate one)</label><input type="text" id="npw">
<div class="row"><button class="btn" id="bOpen">Open session</button><button class="btn" id="bStart">Start quiz for everyone</button>
<button class="btn secondary" id="bExt">Add 5 minutes</button><button class="btn secondary" id="bEnd">End now</button>
<button class="btn secondary" id="bPwd">New password</button><button class="btn secondary" id="bClose">Close quiz</button></div>
<p class="note">Steps: 1. Open session. 2. Give the password to the class; students join and wait. 3. Start quiz. The timer begins for everyone at the same moment.</p></div>
<div class="card"><h2>Students</h2><p class="sub" id="count"></p><div class="names" id="roster"></div></div></div></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id);let pin=sessionStorage.getItem("pin")||"",data=[],skew=0,filled=false;
const fmt=s=>Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function t(cmd,x){const u=new URL(window.API_URL),p=Object.assign({action:"t",pin,cmd,q:$("qsel").value},x||{});for(const k in p)u.searchParams.set(k,p[k]);return fetch(u).then(r=>r.json());}
function refresh(){t("list").then(r=>{if(!r.ok){pin="";sessionStorage.removeItem("pin");$("login").classList.remove("hide");$("panel").classList.add("hide");$("lerr").textContent=r.error;return;}
 $("login").classList.add("hide");$("panel").classList.remove("hide");data=r.quizzes;skew=r.now-Date.now();
 if(!filled){$("qsel").innerHTML=data.map(d=>`<option value="${d.q}">${d.title}</option>`).join("");filled=true;}draw();}).catch(()=>{$("lerr").textContent="Cannot reach the server.";});}
function draw(){const d=data.find(x=>x.q===$("qsel").value);if(!d)return;
 $("state").textContent={closed:"Closed",lobby:"Open, waiting to start",running:"Running",ended:"Ended"}[d.state];$("pw").textContent=d.pwd||"-";
 $("link").textContent=location.href.replace(/teacher\.html.*$/,"")+"quiz.html?q="+d.q;
 $("clk").textContent=d.state==="running"?fmt(Math.max(0,Math.round((d.endsAt-(Date.now()+skew))/1000))):(d.state==="lobby"?fmt(d.durationSec):"-");
 const done=d.done;$("count").textContent=d.joined.length+" joined, "+done.length+" submitted";
 $("roster").innerHTML=d.joined.map(n=>`<span>${n.replace(/</g,"&lt;")}${done.indexOf(n.toLowerCase())>=0?" (submitted)":""}</span>`).join("");}
function act(cmd,x,ask){if(ask&&!confirm(ask))return;t(cmd,x).then(r=>{if(!r.ok)alert(r.error);refresh();});}
$("go").onclick=()=>{pin=$("pin").value;sessionStorage.setItem("pin",pin);$("lerr").textContent="";refresh();};
$("bOpen").onclick=()=>act("open",{min:$("dur").value,pwd:$("npw").value.trim()},"Open a new session? This clears the list of students for this quiz.");
$("bStart").onclick=()=>act("start",{},"Start the timer for everyone now?");
$("bExt").onclick=()=>act("extend",{min:5});$("bEnd").onclick=()=>act("end",{},"End the quiz now? All answers are submitted.");
$("bPwd").onclick=()=>act("pwd",{pwd:$("npw").value.trim()});$("bClose").onclick=()=>act("close",{},"Close this quiz?");
$("qsel").onchange=draw;setInterval(()=>{if(pin)refresh();},4000);setInterval(draw,1000);if(pin)refresh();
</script></body></html>
